# Blueprint Render — déploiement mono-service (Docker) du portail « Mon Espace ».
# Sur Render : New → Blueprint → sélectionnez ce dépôt.
# PLAN GRATUIT (free) : aucune carte requise. La base est ÉPHÉMÈRE (remise à zéro
# à chaque redémarrage/redéploiement, et le service s'endort après ~15 min
# d'inactivité). L'admin est RECRÉÉ automatiquement au démarrage via le bootstrap,
# donc la démo reste fonctionnelle. Pour des données persistantes, passez en
# 'starter' (payant) et ajoutez un bloc `disk` monté sur /data.
services:
  - type: web
    name: cpi-chues-portail
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_MAILER   # démo sans SMTP (l'admin valide les comptes). Retirez si vous configurez le SMTP.
        value: "true"
      - key: DATABASE_FILE
        value: /data/app.db
      - key: STORAGE_DIR
        value: /data/documents
      # Admin créé au 1er démarrage (Render vous demandera ces 2 valeurs).
      # Aucun accès Shell requis. Choisissez un mot de passe fort (≥ 8 car.).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Pour de vrais e-mails, ajoutez : SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM
