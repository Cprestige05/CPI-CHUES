# Blueprint Render — déploiement mono-service (Docker) du portail « Mon Espace ».
# Sur Render : New → Blueprint → sélectionnez ce dépôt.
# PLAN GRATUIT (free) : aucune carte requise. Le disque local est ÉPHÉMÈRE.
# POUR DES DONNÉES PERSISTANTES SANS CARTE : créez une base Turso gratuite
# (https://turso.tech) et renseignez TURSO_DATABASE_URL + TURSO_AUTH_TOKEN
# ci-dessous. La base devient alors un réplica cloud : les comptes et dossiers
# survivent aux redémarrages. (Les FICHIERS déposés restent sur le disque
# éphémère tant qu'on ne les stocke pas aussi en base — voir DEPLOYMENT.md.)
# Sans Turso, la base reste éphémère et seuls l'admin + les agents sont recréés.
services:
  - type: web
    name: cpi-chues-portail
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_MAILER   # démo sans SMTP (l'admin valide les comptes). Retirez si vous configurez le SMTP.
        value: "true"
      - key: DATABASE_FILE
        value: /data/app.db
      - key: STORAGE_DIR
        value: /data/documents
      # Persistance gratuite via Turso (libSQL). Laissez vides pour rester en
      # base éphémère. Renseignez les 2 depuis le dashboard Turso (voir DEPLOYMENT.md).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Admin créé au 1er démarrage (Render vous demandera ces 2 valeurs).
      # Aucun accès Shell requis. Choisissez un mot de passe fort (≥ 8 car.).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Crée 2 agents de démo (agent1@cpi-chues.sn / agent2@cpi-chues.sn, mdp AgentDemo2026)
      # pour tester l'attribution + la vue agent sans Shell. Mettez "false" pour désactiver.
      - key: BOOTSTRAP_DEMO_AGENTS
        value: "true"
      # Pour de vrais e-mails, ajoutez : SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM
